<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradiente folhagem verde agricultura -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <!-- Gradiente terra / solo agrícola -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Fundo escuro premium arredondado -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />

  <!-- Sulcos de solo arado / curvas de nível agrícola -->
  <path d="M12 50 C24 45 40 45 52 50" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M16 56 C26 52 38 52 48 56" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Caule da planta -->
  <path d="M32 48 Q32 30 32 20" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Folha esquerda do broto -->
  <path d="M32 34 C20 34 16 22 23 16 C30 16 32 26 32 34 Z" fill="url(#leafGrad1)" />
  <path d="M32 34 C25 28 24 21 23 16" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Folha direita do broto -->
  <path d="M32 26 C44 26 48 14 41 8 C34 8 32 18 32 26 Z" fill="url(#leafGrad2)" />
  <path d="M32 26 C39 20 40 13 41 8" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Fruto rubi / grão de café -->
  <circle cx="35" cy="38" r="4.5" fill="#dc2626" />
  <ellipse cx="33.5" cy="36.5" rx="1.5" ry="1" fill="#fca5a5" opacity="0.7" />
</svg>
